name: 生成集合源索引

on:
  push:
    branches: [main]
    paths:
      - "apps.txt"
      - "build/**"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    # 每 6 小时刷新一次，抓各应用仓库的新版本
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: index-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 合并各应用仓库的 fnpack.json
        run: python3 build/merge.py

      - name: 自检：分发地址只允许 GitHub
        run: |
          set -euo pipefail
          ALLOW='^(github\.com|raw\.githubusercontent\.com|gh-proxy\.com|ghfast\.top|cdn\.jsdelivr\.net)$'
          HOSTS=$(grep -oE 'https?://[A-Za-z0-9._-]+' fnpack.json | sed -E 's|https?://||' | sort -u)
          BAD=$(printf '%s\n' "$HOSTS" | grep -vE "$ALLOW" || true)
          if [ -n "$BAD" ]; then
            echo "::error::索引里出现非 GitHub 地址"
            printf '  %s\n' "$BAD"
            exit 1
          fi
          echo "自检通过"

      - name: 提交变更
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fnpack.json
          if git diff --cached --quiet; then
            echo "索引无变化"
          else
            git commit -m "chore: 刷新集合源索引"
            git push
          fi
